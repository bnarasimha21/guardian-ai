[project]
name = "guardian-ai"
version = "0.2.0"
description = "GuardianAI - Real-time agent defense monitor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "mcp>=2.3,<3",
]

[project.scripts]
guardian-mcp = "backend.mcp_gateway.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
