{{- $password := include "guardian.dbPassword" . -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "guardian.name" . }}
  labels: {{- include "guardian.labels" . | nindent 4 }}
type: Opaque
stringData:
  GUARDIAN_API_KEYS: {{ .Values.apiKeys | quote }}
  GUARDIAN_APPROVER_KEYS: {{ .Values.approverKeys | quote }}
  {{- if .Values.database.enabled }}
  GUARDIAN_DATABASE_URL: {{ printf "postgresql://guardian:%s@%s-db:5432/guardian" $password (include "guardian.name" .) | quote }}
  {{- else if .Values.database.url }}
  GUARDIAN_DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
{{- if .Values.database.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "guardian.name" . }}-db
  labels: {{- include "guardian.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
{{- end }}
