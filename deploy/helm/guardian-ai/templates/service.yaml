apiVersion: v1
kind: Service
metadata:
  name: {{ include "guardian.name" . }}
  labels: {{- include "guardian.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "guardian.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "guardian.name" . }}
  labels: {{- include "guardian.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels: {{- include "guardian.selector" . | nindent 6 }}
{{- end }}
