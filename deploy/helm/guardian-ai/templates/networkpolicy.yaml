{{- if .Values.networkPolicy.enabled }}
# The decision API accepts calls from labelled client pods only. Closing the
# other half (upstream tools accepting calls only from callers that asked
# GuardianAI first) is the job of the tools' own NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "guardian.name" . }}
  labels: {{- include "guardian.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "guardian.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.clientLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8000}
{{- if .Values.database.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "guardian.name" . }}-db
  labels: {{- include "guardian.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: guardian-ai
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "guardian.selector" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
{{- end }}
