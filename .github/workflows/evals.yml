name: evals

# Detection scorecard. Fails when recall for a critical rule
# (prompt_injection, data_exfiltration, dangerous_code) drops, or when the
# benign flagged or blocked rate rises, compared with evals/baseline.json.
# To accept a deliberate change: python evals/run.py --write-baseline, commit.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Score the corpus and compare with the baseline
        run: python evals/run.py --check
      - name: Committed report is up to date
        run: git diff --exit-code -- evals/report.json evals/report.md
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: |
            evals/report.md
            evals/report.json
