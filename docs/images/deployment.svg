<svg viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>GuardianAI deployment today</title><desc>Two ways GuardianAI runs today, each a single process. In gateway mode an MCP client on the user's machine starts guardian-mcp over stdio, which fronts a local upstream over stdio and a remote upstream over HTTP, with the policy, pins and audit log as local files. In server mode one uvicorn process serves POST /api/check, the dashboard and approvals, and a tap client, with agents, an approver, monitored apps, an optional OpenTelemetry collector and optional Supabase outside it. Trust boundaries are drawn as dashed lines.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker></defs><rect x="0" y="0" width="1000" height="880" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">GuardianAI: Where It Runs Today</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">Two ways to run it, each a single process. Dashed lines are trust boundaries.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">A. GATEWAY MODE: ONE USER&#x27;S MACHINE</text><rect x="30" y="104" width="680" height="312" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="46" y="126" font-size="11.5" fill="#2C2C2A" font-weight="600">Trust boundary: the user&#x27;s machine</text><text x="46" y="141" font-size="10.5" fill="#5F5E5A">trusted here: the operator, the policy file and the pins they approved</text><rect x="46" y="160" width="170" height="84" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="58" y="181" font-size="13" fill="#2C2C2A" font-weight="600">MCP client</text><text x="58" y="198.0" font-size="10.5" fill="#5F5E5A">Claude Desktop, Claude</text><text x="58" y="212.5" font-size="10.5" fill="#5F5E5A">Code or a framework;</text><text x="58" y="227.0" font-size="10.5" fill="#5F5E5A">starts the gateway</text><rect x="286" y="160" width="214" height="84" rx="9" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="298" y="181" font-size="13" fill="#3C3489" font-weight="600">guardian-mcp process</text><text x="298" y="198.0" font-size="10.5" fill="#3C3489">policy engine and detectors</text><text x="298" y="212.5" font-size="10.5" fill="#3C3489">approvals held in memory</text><text x="298" y="227.0" font-size="10.5" fill="#3C3489">dashboard on 127.0.0.1:8000</text><rect x="570" y="160" width="124" height="84" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="582" y="181" font-size="13" fill="#2C2C2A" font-weight="600">Local upstream</text><text x="582" y="198.0" font-size="10.5" fill="#5F5E5A">MCP server, a</text><text x="582" y="212.5" font-size="10.5" fill="#5F5E5A">child process of</text><text x="582" y="227.0" font-size="10.5" fill="#5F5E5A">the gateway</text><path d="M216,202 L283,202" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="249.5" y="194" font-size="10.5" fill="#5F5E5A" text-anchor="middle">stdio</text><path d="M500,202 L567,202" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="533.5" y="194" font-size="10.5" fill="#5F5E5A" text-anchor="middle">stdio</text><rect x="46" y="304" width="204" height="52" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="58" y="325" font-size="12" fill="#0F6E56" font-weight="600">Policy YAML</text><text x="58" y="342.0" font-size="10.5" fill="#0F6E56">reloaded on change</text><rect x="264" y="304" width="204" height="52" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="276" y="325" font-size="12" fill="#2C2C2A" font-weight="600">Pins file</text><text x="276" y="342.0" font-size="10.5" fill="#5F5E5A">tool definition hashes</text><rect x="482" y="304" width="204" height="52" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="494" y="325" font-size="12" fill="#2C2C2A" font-weight="600">Audit log</text><text x="494" y="342.0" font-size="10.5" fill="#5F5E5A">JSONL, one line a decision</text><path d="M393,244 L393,286 M148,286 L584,286" fill="none" stroke="#888780" stroke-width="2"/><path d="M148,286 L148,301" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M366,286 L366,301" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M584,286 L584,301" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="401" y="276" font-size="10.5" fill="#5F5E5A">local files</text><text x="46" y="384" font-size="10.5" fill="#A32D2D">Crossing in, always treated as untrusted: every tool definition and every tool output, from local and remote upstreams alike.</text><text x="46" y="400" font-size="10.5" fill="#A32D2D">Not covered: an agent on this machine that calls an upstream directly never meets the gateway.</text><rect x="750" y="104" width="220" height="312" rx="12" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="7 5"/><text x="766" y="126" font-size="11.5" fill="#A32D2D" font-weight="600">Outside the machine</text><text x="766" y="141" font-size="10.5" fill="#A32D2D">untrusted</text><rect x="766" y="160" width="188" height="84" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="778" y="181" font-size="13" fill="#A32D2D" font-weight="600">Remote upstream</text><text x="778" y="198.0" font-size="10.5" fill="#A32D2D">MCP server over</text><text x="778" y="212.5" font-size="10.5" fill="#A32D2D">Streamable HTTP; token</text><text x="778" y="227.0" font-size="10.5" fill="#A32D2D">read from the environment</text><path d="M500,228 L535,228 L535,256 L730,256 L730,202 L763,202" fill="none" stroke="#7F77DD" stroke-width="2" marker-end="url(#ap)"/><text x="632" y="270" font-size="10.5" fill="#5F5E5A" text-anchor="middle">HTTP, allowed calls only</text><text x="30" y="460" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">B. SERVER MODE: ONE HOSTED PROCESS</text><rect x="330" y="472" width="340" height="306" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="346" y="494" font-size="11.5" fill="#2C2C2A" font-weight="600">Trust boundary: one uvicorn process</text><text x="346" y="509" font-size="10.5" fill="#5F5E5A">all state in memory; a restart clears it</text><rect x="346" y="522" width="308" height="56" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="358" y="543" font-size="13" fill="#2C2C2A" font-weight="600">POST /api/check</text><text x="358" y="560.0" font-size="10.5" fill="#5F5E5A">returns allow, deny or pending; the caller must obey</text><rect x="346" y="586" width="308" height="56" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="358" y="607" font-size="13" fill="#2C2C2A" font-weight="600">Dashboard and approvals API</text><text x="358" y="624.0" font-size="10.5" fill="#5F5E5A">live decisions; only an approver key can answer</text><rect x="346" y="650" width="308" height="56" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="358" y="671" font-size="13" fill="#2C2C2A" font-weight="600">Tap client</text><text x="358" y="688.0" font-size="10.5" fill="#5F5E5A">dials out to each monitored app; observes only</text><rect x="346" y="714" width="308" height="52" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="358" y="735" font-size="13" fill="#0F6E56" font-weight="600">Policy engine and detectors</text><text x="358" y="752.0" font-size="10.5" fill="#0F6E56">the same code the gateway runs</text><rect x="30" y="522" width="186" height="56" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="42" y="543" font-size="13" fill="#2C2C2A" font-weight="600">Agent runtime</text><text x="42" y="560.0" font-size="10.5" fill="#5F5E5A">asks before each tool call</text><path d="M216,550 L343,550" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="278" y="542" font-size="10.5" fill="#5F5E5A" text-anchor="middle">HTTP, agent key</text><rect x="30" y="586" width="186" height="56" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="42" y="607" font-size="13" fill="#2C2C2A" font-weight="600">Approver&#x27;s browser</text><text x="42" y="624.0" font-size="10.5" fill="#5F5E5A">a person, not the agent</text><path d="M216,614 L343,614" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="278" y="606" font-size="10.5" fill="#5F5E5A" text-anchor="middle">approver key</text><rect x="776" y="650" width="194" height="56" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="788" y="671" font-size="13" fill="#A32D2D" font-weight="600">Monitored app</text><text x="788" y="688.0" font-size="10.5" fill="#A32D2D">/ws-observe has no login</text><path d="M654,678 L773,678" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="712" y="670" font-size="10.5" fill="#5F5E5A" text-anchor="middle">WebSocket</text><rect x="776" y="522" width="194" height="56" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="788" y="543" font-size="13" fill="#2C2C2A" font-weight="600">OpenTelemetry collector</text><text x="788" y="560.0" font-size="10.5" fill="#5F5E5A">optional; no arguments on spans</text><path d="M654,550 L773,550" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="712" y="542" font-size="10.5" fill="#5F5E5A" text-anchor="middle">OTLP/HTTP</text><rect x="776" y="586" width="194" height="56" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="788" y="607" font-size="13" fill="#2C2C2A" font-weight="600">Supabase</text><text x="788" y="624.0" font-size="10.5" fill="#5F5E5A">optional usage log, off by default</text><path d="M654,614 L773,614" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="712" y="606" font-size="10.5" fill="#5F5E5A" text-anchor="middle">HTTPS</text><text x="30" y="674" font-size="10.5" fill="#A32D2D">Without keys set, anyone who can</text><text x="30" y="688" font-size="10.5" fill="#A32D2D">reach the server can ask and approve:</text><text x="30" y="702" font-size="10.5" fill="#A32D2D">demo mode only.</text><text x="776" y="730" font-size="10.5" fill="#5F5E5A">Loopback, private and metadata</text><text x="776" y="744" font-size="10.5" fill="#5F5E5A">addresses refused as tap targets.</text><text x="30" y="812" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="824" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#888780" stroke-dasharray="4 3"/><text x="54" y="836" font-size="11.5" fill="#5F5E5A">Trust boundary</text><rect x="180" y="824" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="204" y="836" font-size="11.5" fill="#5F5E5A">Enforces, in the call path</text><rect x="385" y="824" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="409" y="836" font-size="11.5" fill="#5F5E5A">Policy</text><rect x="470" y="824" width="16" height="16" rx="3" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="494" y="836" font-size="11.5" fill="#5F5E5A">Untrusted or unauthenticated</text><text x="30" y="862" font-size="10.5" fill="#5F5E5A">What this shows: each mode is a single process with its state in memory and on local disk. No replicas, no shared store, static keys. The design record lists what changes to serve many teams.</text></svg>