<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>GuardianAI deployment for several teams</title><desc>Agents of two tenants and their approvers call a Kubernetes Service in front of two or more server replicas. Each replica combines the base policy with the caller&#x27;s tenant rules, decides, and writes an audit row before answering. The policies come from ConfigMaps and the keys from a Secret. Approvals and the append-only audit log are in Postgres, shared by every replica.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker></defs><rect x="0" y="0" width="1000" height="760" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">GuardianAI: Several Teams on Kubernetes</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">Replicas hold no state of their own. Approvals and the audit log are in Postgres. Dashed lines are trust boundaries.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">CALLERS</text><rect x="30" y="104" width="210" height="84" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="42" y="125" font-size="13" fill="#2C2C2A" font-weight="600">Tenant payments</text><text x="42" y="142" font-size="10.5" fill="#5F5E5A">agents with keys named</text><text x="42" y="156.5" font-size="10.5" fill="#5F5E5A">payments.*; the tenant is</text><text x="42" y="171.0" font-size="10.5" fill="#5F5E5A">the key name, not the request</text><rect x="30" y="206" width="210" height="84" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="42" y="227" font-size="13" fill="#2C2C2A" font-weight="600">Tenant search</text><text x="42" y="244" font-size="10.5" fill="#5F5E5A">agents with keys named</text><text x="42" y="258.5" font-size="10.5" fill="#5F5E5A">search.*; never sees the</text><text x="42" y="273.0" font-size="10.5" fill="#5F5E5A">payments rules or approvals</text><rect x="30" y="308" width="210" height="98" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="42" y="329" font-size="13" fill="#2C2C2A" font-weight="600">Approvers</text><text x="42" y="346" font-size="10.5" fill="#5F5E5A">people with approver keys;</text><text x="42" y="360.5" font-size="10.5" fill="#5F5E5A">payments.alice answers for</text><text x="42" y="375.0" font-size="10.5" fill="#5F5E5A">payments only; an agent&#x27;s</text><text x="42" y="389.5" font-size="10.5" fill="#5F5E5A">key cannot approve</text><text x="300" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">ONE HELM RELEASE</text><rect x="300" y="104" width="670" height="440" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="316" y="126" font-size="11.5" fill="#2C2C2A" font-weight="600">Trust boundary: the namespace</text><text x="316" y="141" font-size="10.5" fill="#5F5E5A">non-root, read-only filesystem, no added capabilities; readiness fails when the database does not answer</text><rect x="316" y="160" width="180" height="84" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="328" y="181" font-size="13" fill="#2C2C2A" font-weight="600">Service</text><text x="328" y="198" font-size="10.5" fill="#5F5E5A">ClusterIP; spreads</text><text x="328" y="212.5" font-size="10.5" fill="#5F5E5A">connections across</text><text x="328" y="227.0" font-size="10.5" fill="#5F5E5A">ready replicas</text><rect x="540" y="160" width="414" height="126" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><text x="552" y="181" font-size="13" fill="#3C3489" font-weight="600">Server replicas (two by default)</text><text x="552" y="198" font-size="10.5" fill="#3C3489">1. policy for this caller: base rules, then the tenant&#x27;s rules;</text><text x="552" y="212.5" font-size="10.5" fill="#3C3489">   first match decides, so a base deny cannot be overridden</text><text x="552" y="227.0" font-size="10.5" fill="#3C3489">2. decide (0.2 to 0.4 ms), open or join an approval if required</text><text x="552" y="241.5" font-size="10.5" fill="#3C3489">3. write the audit row, then answer; no row, no decision (503)</text><rect x="316" y="300" width="180" height="98" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><text x="328" y="321" font-size="13" fill="#0F6E56" font-weight="600">ConfigMaps</text><text x="328" y="338" font-size="10.5" fill="#0F6E56">base policy and one</text><text x="328" y="352.5" font-size="10.5" fill="#0F6E56">rule file per tenant;</text><text x="328" y="367.0" font-size="10.5" fill="#0F6E56">picked up without</text><text x="328" y="381.5" font-size="10.5" fill="#0F6E56">a restart</text><rect x="316" y="416" width="180" height="84" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="328" y="437" font-size="13" fill="#2C2C2A" font-weight="600">Secret</text><text x="328" y="454" font-size="10.5" fill="#5F5E5A">API keys, approver keys,</text><text x="328" y="468.5" font-size="10.5" fill="#5F5E5A">database URL; a change</text><text x="328" y="483.0" font-size="10.5" fill="#5F5E5A">rolls the pods</text><rect x="540" y="330" width="196" height="126" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="552" y="351" font-size="13" fill="#2C2C2A" font-weight="600">Approvals (Postgres)</text><text x="552" y="368" font-size="10.5" fill="#5F5E5A">one row per approval;</text><text x="552" y="382.5" font-size="10.5" fill="#5F5E5A">an advisory lock per session,</text><text x="552" y="397.0" font-size="10.5" fill="#5F5E5A">so identical calls on two</text><text x="552" y="411.5" font-size="10.5" fill="#5F5E5A">replicas open one approval;</text><text x="552" y="426.0" font-size="10.5" fill="#5F5E5A">kept across restarts</text><rect x="758" y="330" width="196" height="126" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="770" y="351" font-size="13" fill="#2C2C2A" font-weight="600">Audit log (Postgres)</text><text x="770" y="368" font-size="10.5" fill="#5F5E5A">append-only table, UPDATE</text><text x="770" y="382.5" font-size="10.5" fill="#5F5E5A">and DELETE refused; one hash</text><text x="770" y="397.0" font-size="10.5" fill="#5F5E5A">chain per replica; a hash of</text><text x="770" y="411.5" font-size="10.5" fill="#5F5E5A">the arguments, never the</text><text x="770" y="426.0" font-size="10.5" fill="#5F5E5A">arguments</text><path d="M240,146 L312,190" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M240,248 L312,208" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M240,357 L312,226" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M496,202 L536,202" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M496,349 L536,270" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M638,286 L638,326" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M856,286 L856,326" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="316" y="524" font-size="10.5" fill="#A32D2D">The bundled Postgres is one pod with one volume. Use a managed database for anything real.</text><text x="30" y="440" font-size="10.5" fill="#A32D2D">Still true: the tenant is read from a</text><text x="30" y="455" font-size="10.5" fill="#A32D2D">key&#x27;s name; keys are static; a dashboard</text><text x="30" y="470" font-size="10.5" fill="#A32D2D">sees live events only from the replica</text><text x="30" y="485" font-size="10.5" fill="#A32D2D">it is connected to.</text><text x="30" y="580" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">MEASURED ONCE ON A TWO-NODE CLUSTER, 2026-11-17</text><rect x="30" y="592" width="940" height="66" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="46" y="614" font-size="11.5" fill="#2C2C2A">helm install to ready: 58 s.   helm upgrade to four replicas: 23 s.   Two replicas: 664 decisions a second.   Four: 998.   No failed request.</text><text x="46" y="632" font-size="11.5" fill="#2C2C2A">One caller sees 6.9 ms at p50, most of it the network between pods and the audit write. Audit log afterwards: 105,001 rows in 6 chains, intact.</text><text x="46" y="650" font-size="11.5" fill="#5F5E5A">One small cluster, one tenant under load, the load generator in the same cluster, one run of each.</text><text x="30" y="680" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="696" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#888780" stroke-dasharray="3 2"/><text x="54" y="708" font-size="11.5" fill="#5F5E5A">Trust boundary</text><rect x="186.2" y="696" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#7F77DD"/><text x="210.2" y="708" font-size="11.5" fill="#5F5E5A">Decides</text><rect x="298.29999999999995" y="696" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#1D9E75"/><text x="322.29999999999995" y="708" font-size="11.5" fill="#5F5E5A">Policy</text><rect x="404.09999999999997" y="696" width="16" height="16" rx="4" fill="#FAF9F5" stroke="#D3D1C7"/><text x="428.09999999999997" y="708" font-size="11.5" fill="#5F5E5A">State and configuration</text><text x="30" y="738" font-size="11" fill="#5F5E5A">Without a database URL the server runs as before: one process, approvals in memory, no audit log.</text></svg>
