<svg viewBox="0 0 1000 1036" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>GuardianAI decision flow</title><desc>One tool call through the guardian-mcp gateway in eight steps: arrive, scan arguments, policy rules, human approval when required, forward upstream, scan output, redact or warn, return. Five of the steps have an exit where the call or its output is stopped, and every step records a decision.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker></defs><rect x="0" y="0" width="1000" height="1036" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">GuardianAI: One Tool Call, Every Exit</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">Each step either passes the call on or stops it. When the gateway cannot judge, it stops.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">ONE CALL THROUGH THE GATEWAY</text><text x="610" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">WHERE IT STOPS (FAIL CLOSED)</text><rect x="30" y="108" width="500" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><circle cx="54" cy="132" r="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="54" y="136" font-size="12" fill="#2C2C2A" font-weight="600" text-anchor="middle">1</text><text x="76" y="136" font-size="14" fill="#2C2C2A" font-weight="600">Tool call arrives</text><text x="76" y="154" font-size="11" fill="#5F5E5A">tools/call from the MCP client, named server.tool,</text><text x="76" y="169" font-size="11" fill="#5F5E5A">with the agent identity taken from the gateway config</text><path d="M280.0,178 L280.0,201" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="204" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="228" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="232" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">2</text><text x="76" y="232" font-size="14" fill="#0F6E56" font-weight="600">Scan the arguments</text><text x="76" y="250" font-size="11" fill="#0F6E56">regex and URL detectors over every string and key,</text><text x="76" y="265" font-size="11" fill="#0F6E56">also in normalised and decoded form</text><path d="M530,239.0 L606,239.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="208" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="230" font-size="12.5" fill="#A32D2D" font-weight="600">Too large to scan fully</text><text x="624" y="247" font-size="11" fill="#A32D2D">deny, even if a rule would allow it</text><path d="M280.0,274 L280.0,297" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="300" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="324" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="328" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">3</text><text x="76" y="328" font-size="14" fill="#0F6E56" font-weight="600">Policy rules, first match decides</text><text x="76" y="346" font-size="11" fill="#0F6E56">allow, deny or require_approval</text><text x="76" y="361" font-size="11" fill="#0F6E56">no rule matches: the default effect is deny</text><path d="M530,335.0 L606,335.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="304" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="326" font-size="12.5" fill="#A32D2D" font-weight="600">A deny rule, or no rule at all</text><text x="624" y="343" font-size="11" fill="#A32D2D">tool error with the reasons;</text><text x="624" y="357" font-size="11" fill="#A32D2D">nothing is sent upstream</text><path d="M280.0,370 L280.0,393" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="396" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="420" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="424" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">4</text><text x="76" y="424" font-size="14" fill="#0F6E56" font-weight="600">Human approval, when the rule asks for it</text><text x="76" y="442" font-size="11" fill="#0F6E56">bound to a SHA-256 of server, tool and arguments,</text><text x="76" y="457" font-size="11" fill="#0F6E56">single use; asked in the client or on the dashboard</text><path d="M530,431.0 L606,431.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="400" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="422" font-size="12.5" fill="#A32D2D" font-weight="600">Declined, timed out, or no way to ask</text><text x="624" y="439" font-size="11" fill="#A32D2D">denied; changed arguments need</text><text x="624" y="453" font-size="11" fill="#A32D2D">a new approval</text><path d="M280.0,466 L280.0,489" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="492" width="500" height="70" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><circle cx="54" cy="516" r="12" fill="#FFFFFF" stroke="#7F77DD"/><text x="54" y="520" font-size="12" fill="#3C3489" font-weight="600" text-anchor="middle">5</text><text x="76" y="520" font-size="14" fill="#3C3489" font-weight="600">Forward to the upstream MCP server</text><text x="76" y="538" font-size="11" fill="#3C3489">the only point where the call leaves the gateway</text><path d="M280.0,562 L280.0,585" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="588" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="612" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="616" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">6</text><text x="76" y="616" font-size="14" fill="#0F6E56" font-weight="600">Scan the tool output</text><text x="76" y="634" font-size="11" fill="#0F6E56">all of it treated as untrusted, then result rules in order</text><path d="M530,623.0 L606,623.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="592" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="614" font-size="12.5" fill="#A32D2D" font-weight="600">Unscannable, injection or exfil channel</text><text x="624" y="631" font-size="11" fill="#A32D2D">output withheld from the agent</text><path d="M280.0,658 L280.0,681" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="684" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="708" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="712" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">7</text><text x="76" y="712" font-size="14" fill="#0F6E56" font-weight="600">Redact secrets, warn on weaker signals</text><text x="76" y="730" font-size="11" fill="#0F6E56">matched values masked; the rest passes through</text><path d="M530,719.0 L606,719.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="688" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="710" font-size="12.5" fill="#A32D2D" font-weight="600">Redacted copy still matches</text><text x="624" y="727" font-size="11" fill="#A32D2D">output withheld, not passed on</text><path d="M280.0,754 L280.0,777" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="780" width="500" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><circle cx="54" cy="804" r="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="54" y="808" font-size="12" fill="#2C2C2A" font-weight="600" text-anchor="middle">8</text><text x="76" y="808" font-size="14" fill="#2C2C2A" font-weight="600">Result returned to the agent</text><text x="76" y="826" font-size="11" fill="#5F5E5A">with the decision attached in _meta</text><path d="M470,370 L470,489" fill="none" stroke="#1D9E75" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#at)"/><text x="478" y="387" font-size="10.5" fill="#5F5E5A">allow</text><text x="288.0" y="387" font-size="10.5" fill="#5F5E5A">require_approval</text><text x="30" y="876" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">EVERY STEP LEAVES A RECORD</text><rect x="30" y="888" width="940" height="50" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="500" y="910" font-size="12.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">Dashboard card, audit log line and guardian.decision event on the call&#x27;s execute_tool span</text><text x="500" y="927" font-size="11" fill="#5F5E5A" text-anchor="middle">each with a decision id and the rule that decided; arguments stay off spans unless switched on</text><text x="30" y="968" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="980" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#1D9E75"/><text x="54" y="992" font-size="11.5" fill="#5F5E5A">Policy decides here</text><rect x="220" y="980" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#7F77DD"/><text x="244" y="992" font-size="11.5" fill="#5F5E5A">Call leaves the gateway</text><rect x="435" y="980" width="16" height="16" rx="3" fill="#FCEBEB" stroke="#E24B4A"/><text x="459" y="992" font-size="11.5" fill="#5F5E5A">Stopped, nothing passes</text><text x="30" y="1018" font-size="10.5" fill="#5F5E5A">Steps 2 and 3 together take 0.15 ms at p50 and under 0.5 ms at p99: in process, small calls, no network hop. Enforce mode shown; monitor mode records but stops nothing.</text></svg>